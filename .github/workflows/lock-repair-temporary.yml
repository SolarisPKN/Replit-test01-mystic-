name: Replit pnpm lockfile regeneration (temporary)
on:
  push:
    branches:
      - fix/esbuild-lock-sync-20261108
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile without executing dependency scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Export exact generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-mystic
          path: pnpm-lock.yaml
          if-no-files-found: error
