name: pnpm workspace CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install reproducibly (keep release-age protections)
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build monorepo
        # Replit Vite config requires these dev-server settings even for build.
        env:
          PORT: '3000'
          BASE_PATH: '/'
        run: pnpm run build
